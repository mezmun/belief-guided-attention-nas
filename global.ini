[settings]
pop_size = 20
gpu_num = 0
genetic_prob = 0.9, 0.4
mutation_probs = 0.4, 0.3, 0.3
early_stopping = 0
label_smoothing = 0
gradient_clipping = 0
horovod = 1
dataset_directory_ = /kaggle/input/cinic10
dataset_directory = /arf/home/makpolat/datasets

[evolution_status]
is_running = 0

[densenet_configuration]
k_list = 12, 20, 40
k_12 = 128, 3, 10
k_20 = 64, 3, 10
k_40 = 32, 3, 5

[resnet_configuration]
unit_length_limit = 3, 10

[network]
max_length = 50
resnet_limit = 0, 1
pool_limit = 4, 4
densenet_limit = 0, 1
input_channel = 3
input_size = 32
num_class = 10
epoch = 1
output_channel = 64, 128, 256
inception_limit = 0, 1

[belief]
# Start with monitoring. Change mode to guided after the monitoring run is checked.
enabled = 1
mode = guided

# The first five offspring cycles are fully evaluated.
warmup_generations = 5
candidate_multiplier = 5
evaluation_budget = 20

# Fitness belief settings.
kernel_bandwidth = 0.25
belief_method = bayesian_precision
top_neighbours = 5
exclude_exact_matches = 1
minimum_archive_size = 10

# Evaluation selection settings.
selection_policy = quota
mean_quota = 0.60
ucb_quota = 0.20
novelty_quota = 0.10
random_quota = 0.10
ucb_kappa = 0.50
novelty_neighbours = 5

# Uncertainty calibration settings.
calibration_method = ridge
calibration_min_samples = 40
calibration_update_frequency = 1
calibration_ridge_alpha = 1.0
calibration_random_audit_only = 1

# Similarity component weights can be updated from past archive pairs.
learn_similarity_weights = 1
similarity_min_pairs = 50
similarity_max_pairs = 5000
similarity_target_tau = 0.02
similarity_ridge_alpha = 1.0

random_seed = 2312390
output_directory = belief_outputs
